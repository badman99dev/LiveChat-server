# Live chat + live score over SSE (HTTP/2, single TLS connection)
#
# /etc/nginx/sites-available/live-chat  ->  symlink to sites-enabled
# Replace chat.example.com with your domain, then: certbot --nginx -d chat.example.com

worker_rlimit_nofile 8192;

upstream live_chat {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                 # <- one TLS connection, many streams
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ---------- SSE streams ----------
    location /events/ {
        proxy_pass http://live_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;               # CRITICAL: otherwise events get stuck
        proxy_cache off;
        gzip off;                          # gzip also buffers SSE
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;            # CRITICAL: default 60s kills streams
        proxy_send_timeout 24h;
    }

    # ---------- plain API ----------
    location /api/ {
        proxy_pass http://live_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- static frontend ----------
    root /opt/live-chat/public;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(woff2|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/live-chat.access.log;
    error_log  /var/log/nginx/live-chat.error.log;
}
